# symsvel-layout: 4552c056fc2c6608171595ca09b817710b22efcdcc37f83fb1f123a0f27d34a6
site_name: SymSvel - Documentation développeur
site_url: ''
docs_dir: docs
site_dir: site
use_directory_urls: false
theme:
  name: material
  language: fr
  font: false
  logo: symsvel/assets/theme/mark.png
  favicon: symsvel/assets/theme/mark.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer au mode sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer au mode clair
  features:
    - toc.follow
    - navigation.top
    - content.code.copy
plugins:
  - search
  - offline
extra_css:
  - symsvel/assets/theme/symsvel.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      title: Sommaire
      permalink: true
